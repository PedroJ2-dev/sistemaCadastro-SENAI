<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Menu</h1>
    </header>
    <main>
        <section>
            <form id="form-cadastro">
                <h2>Cadastrar novo filme</h2>
                <input type="text" name="titulo" id="titulo" placeholder="Titulo do filme">
                <input type="url" name="imagen" id="imagen" placeholder="URL da imagen do filme">
                <button type="submit">Cadastrar</button>
            </form>
        </section>
        <section id="catalogo">
            <h2>Meus filmes favoritos</h2>
            <section id="lista-filmes">
            </section>
        </section>
    </main>
    <footer>
        <h1>Revisão prova 2026</h1>
    </footer>
    <script src="script.js"></script>
</body>
</html>
